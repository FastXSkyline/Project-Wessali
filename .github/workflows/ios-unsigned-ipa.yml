name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-unsigned-ipa.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'package.json'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Wessali for iPhone (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      COCOAPODS_DISABLE_STATS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm --filter @wessali/contracts build
          pnpm --filter @wessali/design-tokens build
          pnpm --filter @wessali/i18n build

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Discover generated Xcode workspace and app scheme
        id: ios-project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find apps/mobile/ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace was generated."
            exit 1
          fi

          xcodebuild -list -json -workspace "$WORKSPACE" > "$RUNNER_TEMP/xcode-list.json"

          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          schemes = data.get("workspace", {}).get("schemes", [])
          if not schemes:
              schemes = data.get("project", {}).get("schemes", [])

          app_schemes = [scheme for scheme in schemes if not scheme.startswith("Pods-")]
          if not app_schemes:
              raise SystemExit("No application scheme found in the generated Xcode workspace.")

          print(app_schemes[0])
          PY
          )"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

      - name: Build iOS device app without code signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.ios-project.outputs.workspace }}" \
            -scheme "${{ steps.ios-project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WessaliDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$RUNNER_TEMP/WessaliDerivedData/Build/Products"
          echo "Looking for iOS device app bundles under: $PRODUCTS_DIR"
          find "$PRODUCTS_DIR" -maxdepth 4 -type d -name '*.app' -print || true

          APP_PATH="$(find "$PRODUCTS_DIR" -type d -name '*.app' -path '*iphoneos*' -not -path '*iphonesimulator*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No iOS device .app bundle was produced by Xcode."
            echo "Build product directories:"
            find "$PRODUCTS_DIR" -maxdepth 4 -print | head -200 || true
            exit 1
          fi

          echo "Packaging app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          find "$RUNNER_TEMP/ipa/Payload" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" -type f -name embedded.mobileprovision -delete

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Wessali-unsigned.ipa" Payload

          test -s "$GITHUB_WORKSPACE/Wessali-unsigned.ipa"
          echo "Created unsigned IPA:"
          ls -lh "$GITHUB_WORKSPACE/Wessali-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Wessali-unsigned.ipa" | head -25

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wessali-unsigned-IPA
          path: Wessali-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
