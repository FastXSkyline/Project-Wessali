name: Wessali CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm, then install the frozen workspace
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true

      - name: Validate workspaces
        run: pnpm validate
