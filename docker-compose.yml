services:
  postgres:
    image: postgis/postgis:17-3.7
    container_name: wessali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wessali
      POSTGRES_USER: wessali
      POSTGRES_PASSWORD: wessali_dev_only
    ports:
      - "5432:5432"
    volumes:
      - wessali-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wessali -d wessali"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: wessali-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wessali-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wessali-postgres-data:
  wessali-redis-data:
